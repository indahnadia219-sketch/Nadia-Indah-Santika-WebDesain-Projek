
<!DOCTYPE html>
<html>
<head>
    <title>Portfolio</title>

    <style>
        body {
            margin: 0;
            padding: 0 18px;

            overflow: hidden;
            background-color: #333;
            display: flex;
            list-style-type: none;
        }

        li a {
            display: block;
            color: white;
            text-align: center;

        }

            margin-top: 8px;
            padding: 24px 10px;
            background-color: #FFC0CB;
            color: #6B2737;
            min-height: 400px;
        }

        .content h2 {
            margin-top: 0;
            color: #8b0000;
        }

        .portfolio-group h3 {
            color: #6B2737;
        }

        .portfolio-images {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: flex-start;
        }

        .portfolio-images img {
            width: 165px;
            height: 190px;
            object-fit: contain;
        }

        footer {
            margin: 10px 6px 0;
            padding: 16px;
            border-radius: 15px;
            background-color: #B76E79;
            color: #fff;
            text-align: center;
            font-weight: bold;
        }

    <ul>
        <li><a href="home.html">Home</a></li>

                <img src="foto/pancasila.png" alt="Pancasila">
