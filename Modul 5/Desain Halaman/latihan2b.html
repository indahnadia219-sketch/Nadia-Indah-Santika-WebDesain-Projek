<!DOCTYPE html>
<html>
<head>
    <title>Desain Responsif</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style type="text/css">
        #wrapper{
            margin: auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #header{
            height: 150px;
            padding: 20px;
            border: 2px solid red;
        }

        #nav{
            padding: 20px;
            border: 2px solid red;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-evenly;
            gap: 20px;
        }

        #nav h2{
            width: 100%;
            margin-top: 0;
        }

        .box{
            background-color: red;
            color: white;
            padding: 30px;
            text-align: center;
            font-weight: bold;
            flex: 1 1 200px;
        }

        #footer{
            padding: 20px;
            height: 120px;
            border: 2px solid red;
        }

        @media only screen and (max-width: 1080px){
            .box{
                flex: 1 1 40%;
            }
        }

        @media only screen and (max-width: 640px){
            .box{
                flex: 1 1 100%;
            }
        }
    </style>
</head>
<body>

    <div id="wrapper">
        <div id="header">
            <h2>Header</h2>
        </div>

        <div id="nav">
            <h2>Services</h2>
            <div class="box"> BOX 1 </div>
            <div class="box"> BOX 2 </div>
            <div class="box"> BOX 3 </div>
            <div class="box"> BOX 4 </div>
        </div>

        <div id="footer">
            <h2>Footer</h2>
        </div>
    </div>

</body>
</html>
