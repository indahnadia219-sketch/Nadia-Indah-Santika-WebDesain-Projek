<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Web Storage - Dark Mode</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <div class="label">
        <h3>Dark Mode</h3>
        <label class="switch">
            <input type="checkbox" id="toggleTema" onchange="ubahTema(event)">
            <span class="slider"></span>
        </label>
    </div>

    <div class="tulisan">
        <h1>Universitas Sebelas Maret</h1>
        <h2>Pendidikan Teknik Informatika dan Komputer</h2>
    </div>

    <script type="text/javascript">
        const toggleTema = document.getElementById('toggleTema');

        const temaTersimpan = localStorage.getItem('tema');
        if (temaTersimpan === 'dark') {
            document.body.classList.add('dark-mode');
            toggleTema.checked = true; 
        }

        function ubahTema(e) {
            if (e.target.checked) {
                document.body.classList.add('dark-mode');
                localStorage.setItem('tema', 'dark');
            } else {
                document.body.classList.remove('dark-mode');
                localStorage.setItem('tema', 'light');
            }
        }
    </script>
</body>
</html>
